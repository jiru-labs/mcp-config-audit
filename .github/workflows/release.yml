name: Release

# Publishes to PyPI when a version tag is pushed:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# There is no API token here, and none in the repository secrets. PyPI trusts
# this workflow directly, over OIDC (a "trusted publisher"), so the credential
# is minted for one run and expires with it. A token that does not exist cannot
# leak — which is the same argument this project makes to its own users.
#
# Every action is pinned to a commit SHA, not a tag or a branch. A tag can be moved and
# `release/v1` is a branch, so both resolve to whatever that ref points at on the day the
# job runs — and this job holds an OIDC token that can publish to PyPI. Dependabot moves
# the pins in a reviewable PR (.github/dependabot.yml).
#
# Configure the trusted publisher once, at
# https://pypi.org/manage/account/publishing/ :
#
#     PyPI project name: mcp-config-audit
#     Owner:             jiru-labs
#     Repository:        mcp-config-audit
#     Workflow name:     release.yml
#     Environment:       pypi

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Build and check
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # the OIDC token PyPI verifies. Nothing else.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
